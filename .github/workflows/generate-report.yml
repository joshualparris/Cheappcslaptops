name: Generate research PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_report.py"
      - "docs/research/**"
      - ".github/workflows/generate-report.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ReportLab
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Generate PDF
        run: python scripts/generate_report.py

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports/100-dollar-pc-challenge-2026-09-23.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
          else
            git commit -m "Generate $100 PC challenge PDF"
            git push
          fi
