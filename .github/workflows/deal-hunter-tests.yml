name: Deal hunter unit tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/deal_hunter.py'
      - 'tests/test_deal_hunter.py'
      - '.github/workflows/deal-hunter-tests.yml'
  pull_request:
    paths:
      - 'scripts/deal_hunter.py'
      - 'tests/test_deal_hunter.py'
      - '.github/workflows/deal-hunter-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Syntax check
        run: python3 -m py_compile scripts/deal_hunter.py
      - name: Listing classification tests
        run: python3 -m unittest tests.test_deal_hunter
